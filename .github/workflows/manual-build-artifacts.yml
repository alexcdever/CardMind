name: CardMind Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cardmind-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FRB_CODEGEN_VERSION: 2.12.0

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.metadata.outputs.APP_VERSION }}
      flutter_version: ${{ steps.metadata.outputs.FLUTTER_VERSION }}
      windows_build_name: ${{ steps.metadata.outputs.WINDOWS_BUILD_NAME }}
      app_build: ${{ steps.metadata.outputs.APP_BUILD }}
      windows_version: ${{ steps.metadata.outputs.WINDOWS_VERSION }}
      channel: ${{ steps.metadata.outputs.RELEASE_CHANNEL }}
      tag: ${{ steps.metadata.outputs.RELEASE_TAG }}
    steps:
      - uses: actions/checkout@v4
      - id: metadata
        shell: bash
        run: python3 tool/release/release_metadata.py --ref-name "$GITHUB_REF_NAME" --run-number "$GITHUB_RUN_NUMBER" --github-env "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Install Android build tools
        run: cargo install cargo-ndk --locked
      - name: Install FRB codegen
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_CODEGEN_VERSION" --locked
      - name: Prepare dependencies and bindings
        run: flutter pub get && flutter_rust_bridge_codegen generate
      - name: Build Android Rust libraries
        working-directory: rust-backend
        run: cargo ndk -o ../build/android-jni -t armeabi-v7a -t arm64-v8a -t x86_64 build --release
      - name: Remove Android resource marker files
        run: find android/app/src/main/res -type f -name DIR.md -delete
      - name: Build Android APK
        run: flutter build apk --release --build-name "${{ needs.metadata.outputs.flutter_version }}" --build-number "${{ needs.metadata.outputs.app_build }}"
      - name: Stage Android artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk CardMind-Android.apk && test -s CardMind-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: CardMind-Android.apk

  windows:
    name: Windows Inno Setup
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Install FRB codegen
        shell: pwsh
        run: cargo install flutter_rust_bridge_codegen --version $env:FRB_CODEGEN_VERSION --locked
      - name: Prepare dependencies and bindings
        run: flutter pub get; flutter_rust_bridge_codegen generate
      - name: Build Rust library
        working-directory: rust-backend
        run: cargo build --release
      - name: Build Windows application
        run: flutter build windows --release --build-name "${{ needs.metadata.outputs.windows_build_name }}" --build-number "${{ needs.metadata.outputs.app_build }}"
      - name: Install Rust runtime library
        shell: pwsh
        run: |
          Copy-Item rust-backend/target/release/cardmind_backend.dll build/windows/x64/runner/Release/cardmind_backend.dll -Force
          if (-not (Test-Path build/windows/x64/runner/Release/cardmind_backend.dll) -or (Get-Item build/windows/x64/runner/Release/cardmind_backend.dll).Length -eq 0) { throw 'Rust runtime DLL is missing or empty' }
      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress --yes }
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          New-Item -ItemType Directory -Force build/installer | Out-Null
          & $iscc "/DSourceDir=$PWD/build/windows/x64/runner/Release" "/DOutputDir=$PWD/build/installer" "/DMyAppVersion=${{ needs.metadata.outputs.windows_version }}" tool/installer/cardmind.iss
          if (-not (Test-Path build/installer/CardMind-Setup.exe) -or (Get-Item build/installer/CardMind-Setup.exe).Length -eq 0) { throw 'Installer is missing or empty' }
          Copy-Item build/installer/CardMind-Setup.exe CardMind-Setup.exe -Force

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: CardMind-Setup.exe

  linux:
    name: Linux x64
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Install Linux build dependencies
        shell: bash
        run: |
          mapfile -t apt_files < <(find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -print)
          test "${#apt_files[@]}" -gt 0 || { echo 'No apt source files found' >&2; exit 1; }
          for file in "${apt_files[@]}"; do sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' "$file"; done
          if grep -R -n 'azure\.archive\.ubuntu\.com' /etc/apt --include='*.list' --include='*.sources'; then exit 1; fi
          timeout 180s sudo apt-get update
          timeout 180s sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev build-essential
      - name: Install FRB codegen
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_CODEGEN_VERSION" --locked
      - name: Prepare dependencies and bindings
        run: flutter pub get && flutter_rust_bridge_codegen generate
      - name: Build Rust library
        working-directory: rust-backend
        run: cargo build --release
      - name: Build Linux application
        run: flutter build linux --release --build-name "${{ needs.metadata.outputs.flutter_version }}" --build-number "${{ needs.metadata.outputs.app_build }}"
      - name: Install Rust runtime library
        run: |
          mkdir -p build/linux/x64/release/bundle/lib
          cp rust-backend/target/release/libcardmind_backend.so build/linux/x64/release/bundle/lib/libcardmind_backend.so
          test -s build/linux/x64/release/bundle/lib/libcardmind_backend.so
      - name: Package Linux artifact
        run: |
          rm -rf cardmind
          mkdir -p cardmind
          cp -a build/linux/x64/release/bundle/. cardmind/
          tar -czf CardMind-Linux-x64.tar.gz -C . cardmind
          test -s CardMind-Linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: CardMind-Linux-x64.tar.gz

  release:
    name: Publish ${{ needs.metadata.outputs.channel }} release
    needs: [metadata, android, windows, linux]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          expected=(CardMind-Android.apk CardMind-Setup.exe CardMind-Linux-x64.tar.gz)
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#actual[@]}" -eq 3
          for asset in "${expected[@]}"; do test -s "release-assets/$asset"; done
          test "${actual[*]}" = "$(printf '%s\n' "${expected[@]}" | sort | paste -sd' ' -)"
      - name: Generate update manifest
        shell: bash
        run: |
          python3 tool/release/generate_update_manifest.py \
            --assets-dir release-assets \
            --output release-assets/update-${{ needs.metadata.outputs.channel }}.json \
            --repository alexcdever/CardMind \
            --tag "${{ needs.metadata.outputs.tag }}" \
            --channel "${{ needs.metadata.outputs.channel }}" \
            --version "${{ needs.metadata.outputs.app_version }}" \
            --build "${{ needs.metadata.outputs.app_build }}" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --minimum-supported-version "0.1.0-beta.1" \
            --release-notes "Automated ${{ needs.metadata.outputs.channel }} build from ${{ github.sha }}."
          python3 -m json.tool release-assets/update-${{ needs.metadata.outputs.channel }}.json >/dev/null
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: CardMind ${{ needs.metadata.outputs.app_version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.metadata.outputs.channel == 'beta' }}
          files: |
            release-assets/CardMind-Android.apk
            release-assets/CardMind-Setup.exe
            release-assets/CardMind-Linux-x64.tar.gz
            release-assets/update-${{ needs.metadata.outputs.channel }}.json
          body: |
            CardMind ${{ needs.metadata.outputs.channel }} release.
            Version: `${{ needs.metadata.outputs.app_version }}`
            Build: `${{ needs.metadata.outputs.app_build }}`
            Commit: `${{ github.sha }}`
          fail_on_unmatched_files: true
      - name: Publish channel pointer manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alias_tag="channel-${{ needs.metadata.outputs.channel }}"
          alias_file="${{ needs.metadata.outputs.channel }}.json"
          cp "release-assets/update-${{ needs.metadata.outputs.channel }}.json" "release-assets/$alias_file"
          if gh release view "$alias_tag" >/dev/null 2>&1; then
            gh release upload "$alias_tag" "release-assets/$alias_file" --clobber
          else
            gh release create "$alias_tag" "release-assets/$alias_file" \
              --title "CardMind ${{ needs.metadata.outputs.channel }} update channel" \
              --notes "Machine-readable update manifest for the ${{ needs.metadata.outputs.channel }} channel." \
              --target "${{ github.sha }}" \
              ${{ needs.metadata.outputs.channel == 'beta' && '--prerelease' || '' }}
          fi
