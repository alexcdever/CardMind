name: CardMind Main Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cardmind-main-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FRB_CODEGEN_VERSION: 2.12.0

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Install Android build tools
        run: cargo install cargo-ndk --locked
      - name: Install FRB codegen
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_CODEGEN_VERSION" --locked
      - name: Prepare dependencies and bindings
        run: flutter pub get && flutter_rust_bridge_codegen generate
      - name: Build Android Rust libraries
        working-directory: rust-backend
        run: cargo ndk -o ../build/android-jni -t armeabi-v7a -t arm64-v8a -t x86_64 build --release
      - name: Remove Android resource marker files
        run: find android/app/src/main/res -type f -name DIR.md -delete
      - name: Build Android APK
        run: flutter build apk --release
      - name: Stage Android artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk CardMind-Android.apk && test -s CardMind-Android.apk
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: CardMind-Android.apk

  windows:
    name: Windows Inno Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Install FRB codegen
        shell: pwsh
        run: cargo install flutter_rust_bridge_codegen --version $env:FRB_CODEGEN_VERSION --locked
      - name: Prepare dependencies and bindings
        run: flutter pub get; flutter_rust_bridge_codegen generate
      - name: Build Rust library
        working-directory: rust-backend
        run: cargo build --release
      - name: Build Windows application
        run: flutter build windows --release
      - name: Install Rust runtime library
        shell: pwsh
        run: |
          Copy-Item rust-backend/target/release/cardmind_backend.dll build/windows/x64/runner/Release/cardmind_backend.dll -Force
          if (-not (Test-Path build/windows/x64/runner/Release/cardmind_backend.dll) -or (Get-Item build/windows/x64/runner/Release/cardmind_backend.dll).Length -eq 0) { throw 'Rust runtime DLL is missing or empty' }
      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress --yes }
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          New-Item -ItemType Directory -Force build/installer | Out-Null
          & $iscc "/DSourceDir=$PWD/build/windows/x64/runner/Release" "/DOutputDir=$PWD/build/installer" "/DMyAppVersion=1.0.0" tool/installer/cardmind.iss
          if (-not (Test-Path build/installer/CardMind-Setup.exe) -or (Get-Item build/installer/CardMind-Setup.exe).Length -eq 0) { throw 'Installer is missing or empty' }
          Copy-Item build/installer/CardMind-Setup.exe CardMind-Setup.exe -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: CardMind-Setup.exe

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Install Linux build dependencies
        shell: bash
        run: |
          mapfile -t apt_files < <(find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -print)
          test "${#apt_files[@]}" -gt 0 || { echo 'No apt source files found' >&2; exit 1; }
          for file in "${apt_files[@]}"; do
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' "$file"
          done
          if grep -R -n 'azure\.archive\.ubuntu\.com' /etc/apt --include='*.list' --include='*.sources'; then
            echo 'Azure Ubuntu mirror remains in apt sources' >&2
            exit 1
          fi
          timeout 180s sudo apt-get update
          timeout 180s sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev build-essential
      - name: Install FRB codegen
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_CODEGEN_VERSION" --locked
      - name: Prepare dependencies and bindings
        run: flutter pub get && flutter_rust_bridge_codegen generate
      - name: Build Rust library
        working-directory: rust-backend
        run: cargo build --release
      - name: Build Linux application
        run: flutter build linux --release
      - name: Install Rust runtime library
        run: |
          mkdir -p build/linux/x64/release/bundle/lib
          cp rust-backend/target/release/libcardmind_backend.so build/linux/x64/release/bundle/lib/libcardmind_backend.so
          test -s build/linux/x64/release/bundle/lib/libcardmind_backend.so
      - name: Package Linux artifact
        run: |
          rm -rf cardmind
          mkdir -p cardmind
          cp -a build/linux/x64/release/bundle/. cardmind/
          tar -czf CardMind-Linux-x64.tar.gz -C . cardmind
          test -s CardMind-Linux-x64.tar.gz
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: CardMind-Linux-x64.tar.gz

  release:
    name: Publish development release
    needs: [android, windows, linux]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          expected=(CardMind-Android.apk CardMind-Setup.exe CardMind-Linux-x64.tar.gz)
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#actual[@]}" -eq 3
          for asset in "${expected[@]}"; do test -s "release-assets/$asset"; done
          printf '%s\n' "${actual[@]}" | sort -c
          test "${actual[*]}" = "$(printf '%s\n' "${expected[@]}" | sort | paste -sd' ' -)"
      - name: Compute development release tag
        id: tag
        shell: bash
        run: echo "tag=dev-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Create or update pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: CardMind ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            release-assets/CardMind-Android.apk
            release-assets/CardMind-Setup.exe
            release-assets/CardMind-Linux-x64.tar.gz
          body: |
            Automated development build from `main`.
            Commit: `${{ github.sha }}`
            Assets: Android APK, Windows Inno Setup installer, and Linux x64 tar.gz.
          fail_on_unmatched_files: true
