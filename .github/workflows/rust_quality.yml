name: Rust Code Quality

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'rust-backend/**'
      - '.github/workflows/rust_quality.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'rust-backend/**'
      - '.github/workflows/rust_quality.yml'

env:
  RUST_VERSION: 'stable'
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-backend/target/
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-

      - name: Check code formatting
        # 与本地门禁 tool/src/git_gate/command.dart 的 Commands.formatRust()
        # 同源：rust-backend 是多成员 workspace，缺 --all 时只格式化根 crate，
        # tool/boundary_scanner 会被静默跳过。
        run: |
          cd rust-backend
          cargo fmt --all -- --check

      - name: Run cargo check
        run: |
          cd rust-backend
          cargo check --all-targets --all-features

      - name: Run cargo clippy
        run: |
          cd rust-backend
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Run cargo test
        env:
          # 无 IPv4 时配对/连接用例必须判失败，不得在 CI 上假绿。
          CARDMIND_REQUIRE_NETWORK_TESTS: '1'
        run: |
          cd rust-backend
          # 与本地 tool/quality.dart 口径一致：串行跑测试二进制，避免 iroh/netmon 全局资源竞争。
          cargo test --all-features --jobs 1

      - name: Security audit
        run: |
          cargo install cargo-audit
          cd rust-backend
          cargo audit
        continue-on-error: true

      - name: Generate summary
        if: always()
        run: |
          echo "## Rust Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All Rust quality checks completed" >> $GITHUB_STEP_SUMMARY
