name: Flutter Code Quality

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter_quality.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter_quality.yml'

env:
  FLUTTER_VERSION: '3.44.9'
  DART_TERM_COLOR: always

jobs:
  flutter-quality:
    name: Flutter Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 全历史：docs_acceptance_test 用 `git log --format=%cs` 取文档真实
          # 最近修改日期，浅克隆（fetch-depth:1）只能看到 HEAD commit 会假失败。
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build host Rust library for FRB tests
        # `flutter test` 里依赖 libcardmind_backend 的集成测试需要 host 动态库；
        # `dart run tool/build.dart lib` = cargo build --release + 同步到运行态路径。
        run: dart run tool/build.dart lib

      - name: Run flutter analyze
        run: flutter analyze

      - name: Run flutter test
        run: flutter test --timeout 5m

      - name: Generate summary
        if: always()
        run: |
          echo "## Flutter Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All Flutter quality checks completed" >> $GITHUB_STEP_SUMMARY
