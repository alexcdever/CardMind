name: Flutter Code Quality

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter_quality.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter_quality.yml'

env:
  FLUTTER_VERSION: '3.44.9'
  DART_TERM_COLOR: always

jobs:
  flutter-quality:
    name: Flutter Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 全历史：test/product_doc_test.dart 用 `git log --format=%cs` 取文档真实
          # 最近修改日期，浅克隆（fetch-depth:1）只能看到 HEAD commit 会假失败。

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build host Rust library for FRB tests
        # `flutter test` 里依赖 libcardmind_backend 的集成测试需要 host 动态库；
        # `dart run tool/build.dart lib` = cargo build --release + 同步到运行态路径。
        run: dart run tool/build.dart lib

      - name: Run flutter analyze
        run: flutter analyze

      - name: Run flutter test
        # 与本地 `dart run tool/quality.dart` 对齐（quality.dart L150-157）：
        # --coverage 产出 coverage/lcov.info（边界扫描依赖），--timeout 5m 保留。
        # 有意不带 `-j`：flutter test 默认并发按 runner CPU 核数自适应，
        # 本地固定 -j 4 是开发机口径，与本地差异仅并发度，覆盖率/超时语义一致。
        run: flutter test --coverage --timeout 5m

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-lcov
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

      - name: Generate summary
        if: always()
        run: |
          echo "## Flutter Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All Flutter quality checks completed" >> $GITHUB_STEP_SUMMARY
