[package]
name = "cardmind-backend"
version = "0.1.0"
edition = "2021"

# 门禁的 cargo fmt --all / clippy --all-targets 以 workspace 为单位执行；
# tool/boundary_scanner 此前是独立 crate（自带 Cargo.lock），不在 workspace
# 时 fmt/clippy 静默跳过它。纳入 workspace 后统一受门禁覆盖。
[workspace]
members = [".", "tool/boundary_scanner"]

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[profile.release]
# macOS 27 已验证：strip = true 的 dylib dlopen 正常，__LINKEDIT 结尾 16 字节对齐。
strip = true

[features]
# 测试后门：SyncService 上 *_for_test / set_current_pairing_session 等
# #[doc(hidden)] 方法仅此 feature（或 cfg(test)）下编译进 lib。
# tests/*.rs 是独立 crate、对 lib 不启用 cfg(test)，故靠下方 dev-dependency
# 自引用在 `cargo test` 时自动启用本 feature；release 构建不含这些方法。
test-utils = []

[dependencies]
flutter_rust_bridge = "=2.12.0"
loro = "1"
iroh = "1"
# iroh 1.x 把 mDNS 地址解析挪到独立 crate：用于"测试连接/同步"时在局域网内
# 按 peer id 解析对端当前地址，弥补 last_ips 过期后无兜底寻址的问题。
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
atomic-write-file = "0.2"
mdns-sd = "0.20"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
# 配对码生成（密码学随机，OsRng；任务 G 配对安全要求）
rand = "0.8"
# 结构化调试日志（debug-log 任务；PlatformSink 经 tracing 输出）
tracing = "0.1"
# 签名配对凭证：URL-safe base64（无 padding）编解码
base64 = "0.22"
# 主机名探测（gethostname(3)；设备名不再依赖 GUI 进程不继承的 HOSTNAME 环境变量）
libc = "0.2"

[dev-dependencies]
# 仅测试构建启用：本地 relay 服务器（iroh::test_utils::run_relay_server），
# 用于离线验证 relay 跨网段连接行为，避免依赖公共 relay 的网络可达性。
iroh = { version = "1", features = ["test-utils"] }
# dev-dependency 自引用（cargo 支持）：让 tests/*.rs 外部 crate 编译时
# 对 lib 启用 test-utils feature，使 #[cfg(feature = "test-utils")] 的
# 测试后门方法对集成测试可见；对正常 build/release 无影响。
cardmind-backend = { path = ".", features = ["test-utils"] }
