[package]
name = "cardmind-backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
loro = "1"
iroh = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
atomic-write-file = "0.2"
mdns-sd = "0.20"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
# 配对码生成（密码学随机，OsRng；任务 G 配对安全要求）
rand = "0.8"
# 结构化调试日志（debug-log 任务；PlatformSink 经 tracing 输出）
tracing = "0.1"
# 签名配对凭证：URL-safe base64（无 padding）编解码
base64 = "0.22"

[dev-dependencies]
# 仅测试构建启用：本地 relay 服务器（iroh::test_utils::run_relay_server），
# 用于离线验证 relay 跨网段连接行为，避免依赖公共 relay 的网络可达性。
iroh = { version = "1", features = ["test-utils"] }
