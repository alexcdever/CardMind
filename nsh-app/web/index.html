<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CardMind Editor</title>
    <style>
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: #f4f4f2;
        color: #1a1a18;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.65;
      }
      #editor {
        padding: 20px 24px;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .ProseMirror {
        outline: none;
        min-height: 60vh;
      }
      .ProseMirror p {
        margin: 0 0 0.6em;
      }
      .ProseMirror h1 {
        font-size: 1.6em;
        margin: 0.8em 0 0.4em;
      }
      .ProseMirror h2 {
        font-size: 1.3em;
        margin: 0.8em 0 0.4em;
      }
      .ProseMirror h3 {
        font-size: 1.15em;
        margin: 0.7em 0 0.35em;
      }
      .ProseMirror ul,
      .ProseMirror ol {
        padding-left: 1.4em;
        margin: 0 0 0.6em;
      }
      .ProseMirror blockquote {
        margin: 0 0 0.6em;
        padding: 2px 0 2px 12px;
        border-left: 3px solid #d8d8d2;
        color: #55554e;
      }
      .ProseMirror code {
        background: #edede8;
        border-radius: 4px;
        padding: 0.1em 0.3em;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.9em;
      }
      .ProseMirror pre {
        background: #1e1e1c;
        color: #e8e8e4;
        border-radius: 8px;
        padding: 12px 14px;
        overflow-x: auto;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.85em;
      }
      .ProseMirror pre code {
        background: none;
        padding: 0;
        color: inherit;
      }
      .ProseMirror hr {
        border: none;
        border-top: 1px solid #d8d8d2;
        margin: 1.2em 0;
      }
      .ProseMirror a {
        color: #4f6e0c;
      }
      /* 3.5 最小标签行（#tag-strip）：原生 set-tags 写入的当前笔记标签。 */
      #tag-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 6px 24px 0;
        min-height: 0;
      }
      #tag-strip:empty {
        display: none;
      }
      #tag-strip .tag {
        font-size: 12px;
        color: #55554e;
        background: #edede8;
        border: 1px solid #d8d8d2;
        border-radius: 10px;
        padding: 1px 8px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <!-- Phase 3: Tiptap 编辑器挂载点；bundle 由 esbuild 产出（web/dist/bundle.js）。 -->
    <!-- 3.5 最小标签行：原生 set-tags → 页内渲染当前笔记标签（联动锚点）。 -->
    <div id="tag-strip" aria-label="笔记标签"></div>
    <div id="editor"></div>
    <script src="./dist/bundle.js"></script>
  </body>
</html>
