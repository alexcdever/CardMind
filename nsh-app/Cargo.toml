[package]
name = "nsh-app-cardmind"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.1.1"
nsh-ui-mobile = "0.1.1"
env_logger = "0.11"

# 真后端（施工方案 1.7 + 1.4）：`nsh-app` 是独立 workspace（空 `[workspace]` 表），
# 用 path 依赖指向 rust-backend；不并入 rust-backend 的 workspace
# （那边 crate-type 为 cdylib/staticlib/lib，与这里的 bin+lib 混编会冲突）。
cardmind-backend = { path = "../rust-backend" }
# `SyncService::new()` 是 async，全局单例用 tokio::sync::Mutex 惰性初始化。
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.1.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.1.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.1.1", default-features = false }
