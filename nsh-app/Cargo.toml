[package]
name = "nsh-app-cardmind"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.7.0"
nsh-base = "0.7.0"

# 真后端（施工方案 1.7 + 1.4）：`nsh-app` 是独立 workspace（空 `[workspace]` 表），
# 用 path 依赖指向 rust-backend 的 lib 产物；两个 workspace 保持独立互不影响。
cardmind-backend = { path = "../rust-backend" }
# `SyncService::new()` 是 async，全局单例用 tokio::sync::Mutex 惰性初始化。
tokio = { version = "1", features = ["sync"] }
